name: ddd
description: >-
  Domain-Driven Design skill. Use when designing, reviewing, or refactoring
  software with DDD: bounded contexts, aggregates, ubiquitous language,
  domain model, hexagonal architecture, application services, repositories,
  domain events, tactical and strategic design.

triggers:

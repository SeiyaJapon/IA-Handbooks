  - references/09-user-preferences.md

# Behaviour rules surfaced from SKILL.md, restated here so the runtime can
# enforce them as part of the skill activation contract.
rules:
  - Never start with folders, layers, repositories, controllers, queues,
    databases, CQRS, Event Sourcing, or Event-Driven Architecture.
  - Always start with the domain.
  - Mandatory order: applicability, subdomains, language, bounded contexts,
    boundaries, context map, internal model, tactical patterns, layout,
    integration patterns.
  - A bounded context is a semantic boundary, not a folder, module, package,
    namespace, microservice, repository, or database schema.
  - CQRS, Event Sourcing, and EDA are optional patterns, not DDD defaults.
  - Do not create separate skills for CQRS, Event Sourcing, or EDA yet.

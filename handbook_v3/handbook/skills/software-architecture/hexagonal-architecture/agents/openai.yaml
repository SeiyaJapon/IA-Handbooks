# Behaviour rules surfaced from SKILL.md, restated here so the runtime can
# enforce them as part of the skill activation contract.
rules:
  - Never start hexagonal work from folders, frameworks, transports, or
    persistence. Always start from the application core and its ports.
  - The valid layers are exactly three (domain, application, infrastructure).
    Presentation is not a layer.
  - Dependencies point inward only. Domain depends on nothing; application
    depends on domain and ports; infrastructure depends on application and
    domain.
  - Ports live in domain or application. Adapters live in infrastructure.
    A port in infrastructure is a violation.
  - Hexagonal is independent of DDD, Clean Architecture, Onion Architecture,
    CQRS, Event Sourcing, EDA, microservices, and serverless. Do not load
    those skills as part of hexagonal work; finish the hexagonal step first.

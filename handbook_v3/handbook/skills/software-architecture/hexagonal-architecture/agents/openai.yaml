name: hexagonal-architecture
description: >-
  Hexagonal Architecture skill (Ports and Adapters). Use when designing,
  reviewing, or refactoring software with hexagonal: ports (driving and
  driven), adapters, the three-layer model (domain, application,
  infrastructure), the dependency rule, and the layout for projects that
  may include multiple bounded contexts.

